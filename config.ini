# 该文件用于: 管理整个项目的配置

# 日志配置
[log]
log_file = logs/app.log

# MySQL 配置
[mysql]
host = localhost
port = 3306
user = root
password = 123456
database = xx_school_rag

# Redis 配置
[redis]
host = localhost
port = 6379
password = 1234
db = 1

# milvus 配置
[milvus]
host = localhost
port = 19530
database_name = xx_school_rag
collection_name = xx_school_rag_collection

[llm]
; 使用 DeepSeek 兼容 OpenAI 接口
model = deepseek-v4-flash
api_key =
base_url = https://api.deepseek.com

[retrieval]
parent_chunk_size = 1200
child_chunk_size = 300
chunk_overlap = 50
retrieval_k = 3
candidate_m = 2

[app]
valid_sources = ["报到", "住宿", "校园卡", "食堂", "选课", "军训", "快递", "交通", "学习", "社团", "图书馆", "校园生活"]
customer_service_phone = 12345678

[bm25]
; BM25 检索参数（可后续调整）
threshold = 0.85
; 相似度阈值，高于此值才视为可靠答案
